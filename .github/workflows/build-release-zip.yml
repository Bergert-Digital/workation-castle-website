name: Build release zip

# Reusable workflow: checks out a tag, builds the JS bundle, installs prod
# Composer deps (so the plugin-update-checker vendor/ ships), patches the
# version into style.css + functions.php + package.json, packs a version-less
# workation-castle-theme.zip via rsync + .distignore, and uploads it to the
# matching GitHub Release.
#
# Called from release-please.yml (automatic when release-please drafts a
# release) and release.yml (workflow_dispatch fallback for re-attaching).
#
# release-please creates the release as a DRAFT; the final step here publishes
# it once the zip is attached. Client sites must never see a published release
# without its asset: the theme's update checker requires the asset, so an
# assetless release would simply offer no update until this job finishes.
#
# Because a draft release has no git tag yet, callers that draft a release pass
# the commit SHA as `ref`; `tag` is still used to address the release itself.
#
# The asset filename is intentionally version-less so the GitHub download URL
# is stable (/releases/download/v<X.Y.Z>/workation-castle-theme.zip) and the
# theme's ThemeUpdater asset regex never needs updating per release.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build workation-castle-theme.zip for (e.g. v0.2.0)'
        required: true
        type: string
      ref:
        description: 'Commit-ish to build from. Defaults to `tag`; pass a SHA when the tag does not exist yet (draft release).'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  attach-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Install Composer prod deps (PUC) into vendor/
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

      - name: Build JS bundle
        run: |
          npm ci
          npm run build

      - name: Patch version into style.css, functions.php and package.json
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          sed -i -E "s/^(Version:[[:space:]]+).+$/\1$VERSION/" style.css
          sed -i -E "s/(define\([[:space:]]*'WORKATION_VERSION',[[:space:]]*')[^']*('[[:space:]]*\))/\1$VERSION\2/" functions.php
          VERSION="$VERSION" node -e "const p=require('./package.json');p.version=process.env.VERSION;require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
          grep -E "^Version:" style.css
          grep "WORKATION_VERSION" functions.php
          grep '"version"' package.json

      - name: Build distributable zip
        run: |
          STAGE="$(mktemp -d)/workation"
          mkdir -p "$STAGE"
          rsync -a --exclude-from=.distignore ./ "$STAGE/"
          ( cd "$(dirname "$STAGE")" && zip -rq "$GITHUB_WORKSPACE/workation-castle-theme.zip" workation )
          unzip -l "workation-castle-theme.zip" | tail -5

      - name: Upload zip to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" workation-castle-theme.zip --clobber

      # Only now does the release become visible to client sites (and only now
      # does the git tag exist, since publishing a draft creates it). Idempotent:
      # a no-op when release.yml re-attaches to an already-published release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json isDraft,tagName,assets \
            -q '"published: \(.isDraft == false)  tag: \(.tagName)  assets: \([.assets[].name] | join(","))"'
