name: CI

on:
  pull_request:
  push:
    branches: [main, development]

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      - run: composer install --prefer-dist --no-progress
      - run: composer lint

  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run build

  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: workation
      - uses: actions/checkout@v6
        with:
          repository: Bergert-Digital/pediment
          ref: development
          path: pediment
      - uses: actions/checkout@v6
        with:
          repository: Bergert-Digital/pediment-ai
          ref: development
          path: pediment-ai
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: workation/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      - name: Build parent theme blocks
        run: cd pediment && npm ci && npm run build
      - name: Build plugin
        run: cd pediment-ai && composer install --prefer-dist --no-progress && npm ci && npm run build
      - name: Install child deps
        run: cd workation && composer install --prefer-dist --no-progress && npm ci
      - name: Point wp-env at locally-checked-out parent + plugin
        run: |
          cat > workation/.wp-env.override.json <<'JSON'
          { "themes": [".", "../pediment"], "plugins": ["../pediment-ai"] }
          JSON
      - name: Start wp-env
        run: cd workation && npm run env:start
      - name: Build child blocks
        run: cd workation && npm run build
      - name: Run PHPUnit
        run: cd workation && npx wp-env run tests-wordpress --env-cwd=wp-content/themes/workation vendor/bin/phpunit
      - if: always()
        run: cd workation && npm run env:stop

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: workation
      - uses: actions/checkout@v6
        with:
          repository: Bergert-Digital/pediment
          ref: development
          path: pediment
      - uses: actions/checkout@v6
        with:
          repository: Bergert-Digital/pediment-ai
          ref: development
          path: pediment-ai
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: workation/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      - run: cd pediment && npm ci && npm run build
      - run: cd pediment-ai && composer install --prefer-dist --no-progress && npm ci && npm run build
      - run: cd workation && npm ci
      - run: cd workation && npx playwright install --with-deps chromium
      - name: Point wp-env at locally-checked-out parent + plugin
        run: |
          cat > workation/.wp-env.override.json <<'JSON'
          { "themes": [".", "../pediment"], "plugins": ["../pediment-ai"] }
          JSON
      - run: cd workation && npm run env:start
      - run: cd workation && npm run build
      - run: cd workation && npx wp-env run cli wp theme activate workation
      - run: cd workation && npx wp-env run cli wp workation seed
      # Write .htaccess so Apache serves pretty permalinks. The seed's
      # flush_rewrite_rules() runs under WP-CLI where got_mod_rewrite() is false,
      # so it never writes .htaccess; without it every /slug/ URL 404s at Apache
      # (and WP canonical-redirects ?page_id= URLs to those 404ing pretty URLs).
      - run: cd workation && npx wp-env run cli wp rewrite flush --hard
      - run: cd workation && npm run e2e
      - if: always()
        run: cd workation && npm run env:stop
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: workation/playwright-report/
