name: CI

on:
  pull_request:
  push:
    branches: [main, development]

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      - run: composer install --prefer-dist --no-progress
      - run: composer lint

  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run build
      - run: npm run test:tools
      - run: node --test tools/manifest-from-wxr.test.mjs

  phpunit:
    runs-on: ubuntu-latest
    steps:
      # The theme is mounted at wp-content/themes/<basename of the checkout>,
      # so the checkout path is what fixes the --env-cwd below.
      - uses: actions/checkout@v6
        with:
          path: workation
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: workation/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      - name: Install dependencies
        run: cd workation && composer install --prefer-dist --no-progress && npm ci
      - name: Start wp-env
        run: cd workation && npm run env:start
      - name: Build client blocks
        run: cd workation && npm run build
      - name: Run PHPUnit
        run: cd workation && npx wp-env run tests-wordpress --env-cwd=wp-content/themes/workation vendor/bin/phpunit
      - name: Fail if the string template is stale
        # -I ignores the POT-Creation-Date line, which `wp i18n make-pot`
        # rewrites to "now" on every run regardless of whether any string
        # actually changed, and the Project-Id-Version line, which carries the
        # style.css version that release-please bumps — without both, this step
        # would fail on every build or on every release PR.
        run: cd workation && npm run i18n:pot && git diff --exit-code -I'^"POT-Creation-Date:' -I'^"Project-Id-Version:' -- languages/workation.pot
      - if: always()
        run: cd workation && npm run env:stop

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: workation
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: workation/package-lock.json
      - run: cd workation && npm ci
      - run: cd workation && npx playwright install --with-deps chromium
      - run: cd workation && npm run env:start
      - run: cd workation && npm run build
      # Everything the specs navigate to comes from seed/manifest.php, so the
      # site has to be seeded before they run. Languages first: `wp pediment
      # seed` crosses every entry with every language Polylang reports.
      - run: cd workation && npm run languages
      - run: cd workation && npm run seed
      - run: cd workation && npm run seed:cpt
      # Write .htaccess so Apache serves pretty permalinks. The seed's
      # flush_rewrite_rules() runs under WP-CLI where got_mod_rewrite() is false,
      # so it never writes .htaccess; without it every /slug/ URL 404s at Apache
      # (and WP canonical-redirects ?page_id= URLs to those 404ing pretty URLs).
      - run: cd workation && npx wp-env run cli wp rewrite flush --hard
      - run: cd workation && npm run e2e
      - if: always()
        run: cd workation && npm run env:stop
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: workation/playwright-report/
